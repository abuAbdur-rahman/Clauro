[package]
name = "clauro-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clauro-core = { path = "../clauro-core" }
clauro-fs = { version = "0.1.0", path = "../clauro-fs" }
clauro-store = { version = "0.1.0", path = "../clauro-store" }
html2text = "0.17"
reqwest = { version = "0.13.1", default-features = false, features = ["rustls", "webpki-roots", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
# ReplaceFileW for the staged swap (D34/D128, audit 11) and the security-descriptor
# read-backs in tests. User-approved; recorded in TECH_STACK.md §6.2 — the rejected
# alternatives (hand-rolled FFI, in-place write) live there. windows-link (its only
# dep) has a `#[cfg(not(windows))]` arm, so the crate compiles inert on the Linux
# floor; every use in this crate is `#[cfg(windows)]`-gated, so nothing references
# the Win32 imports off-Windows.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
] }
