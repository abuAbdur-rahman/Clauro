<!doctype html>
<html lang="en" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clauro</title>
<style>
/* ===== TOKENS ===== */
:root{--bg:#f3f3f3;--sidebar:#eeeeee;--surface:#ffffff;--surface-2:#f9f9f9;--border:#e0e0e0;--text:#1b1b1b;--muted:#6b6b6b;--hover:rgba(0,0,0,.05);--active:rgba(0,0,0,.09);--accent:#c96442;--accent-contrast:#fff;--danger:#c42b1c;--success:#0f7b0f;--warn:#9d5d00;--shadow:0 8px 24px rgba(0,0,0,.14);--fs:15px}
:root[data-theme="dark"]{--bg:#202020;--sidebar:#1b1b1b;--surface:#2b2b2b;--surface-2:#323232;--border:#3d3d3d;--text:#f2f2f2;--muted:#a0a0a0;--hover:rgba(255,255,255,.06);--active:rgba(255,255,255,.1);--shadow:0 8px 24px rgba(0,0,0,.5);--warn:#e0a040}
/* ===== BASE ===== */
*{box-sizing:border-box}
html,body{margin:0}
body{height:100vh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
body::after{content:"";position:fixed;inset:0;box-shadow:inset 0 0 0 1px var(--border);pointer-events:none;z-index:999}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg.lucide,i[data-lucide]{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
[hidden]{display:none!important}
.muted{color:var(--muted)}.sm{font-size:12px}.grow{flex:1}.mono{font-family:"Cascadia Code",Consolas,monospace}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
kbd{font:12px "Cascadia Code",Consolas,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2);color:var(--muted)}
/* ===== TITLEBAR ===== */
#titlebar{height:32px;flex:none;display:flex;align-items:center;background:var(--bg);-webkit-app-region:drag;user-select:none}
.tb-l{display:flex;align-items:center;gap:8px;padding-left:10px;min-width:0;max-width:60%}
.tb-l svg{color:var(--accent)}
.drag{flex:1;height:100%}
.cap{width:46px;height:32px;display:grid;place-items:center;-webkit-app-region:no-drag}
.cap:hover{background:var(--hover)}.cap.close:hover{background:#C42B1C;color:#fff}
/* ===== LAYOUT ===== */
#app{flex:1;min-height:0;display:grid;grid-template-columns:var(--sbw) 1fr var(--apw);--sbw:260px;--apw:0px;transition:grid-template-columns .15s ease-out;position:relative}
#app.collapsed{--sbw:56px}#app.p-open{--apw:420px}
#sidebar{background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden}
#main{background:var(--surface);min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
#panel{display:flex;flex-direction:column;background:var(--surface);overflow:hidden;min-width:0;visibility:hidden}
.p-open #panel{visibility:visible;border-left:1px solid var(--border)}
/* ===== CONTROLS ===== */
.btn{height:32px;padding:0 12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.sm{height:28px;padding:0 10px}
.btn.primary{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger-fill{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.wide{width:100%;justify-content:flex-start}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:4px;flex:none}
.icon-btn.sm{width:24px;height:24px}
.icon-btn:hover{background:var(--hover)}.icon-btn.on{color:var(--accent);background:var(--hover)}
.inp{height:32px;width:100%;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);outline:0}
textarea.inp{height:auto;padding:8px 10px;resize:vertical}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tog{width:40px;height:20px;border-radius:10px;border:1px solid var(--muted);position:relative;flex:none;transition:.12s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:.12s}
.tog.on{background:var(--accent);border-color:var(--accent)}.tog.on::after{left:23px;background:var(--accent-contrast)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:4px;background:var(--hover);font-size:12px;max-width:100%}
.chip button{display:grid;place-items:center}
.chip.big{height:32px;padding:0 14px;border:1px solid var(--border);background:var(--surface);font-size:13px}
.chip.big:hover{background:var(--hover)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.pill{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--hover);color:var(--muted)}
.pill.connected{color:var(--success);background:rgba(15,123,15,.12)}.pill.error{color:var(--danger);background:rgba(196,43,28,.12)}
.card{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:12px}
.track{height:4px;border-radius:2px;background:var(--active);overflow:hidden;flex:1}.fill{height:100%;background:var(--accent)}
.spin{width:12px;height:12px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.logo{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-contrast);display:inline-grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.logo.big{width:56px;height:56px}.logo.big svg{width:28px;height:28px}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-contrast);display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none}
/* ===== SIDEBAR ===== */
.sb-top{display:flex;justify-content:flex-end;padding:6px 8px 0}
.collapsed .sb-top{justify-content:center}
.sb-nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.collapsed .sb-nav{padding:6px 8px}
.nav{height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:4px}
.nav:hover{background:var(--hover)}.nav.on{background:var(--active)}
.btn.wide kbd{margin-left:auto;background:transparent;color:inherit;border-color:rgba(255,255,255,.4)}
.sb-list{flex:1;overflow:auto;padding:4px 8px}
.gh{position:sticky;top:0;background:var(--sidebar);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 8px 4px}
.crow{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 10px;border-radius:4px;cursor:pointer}
.crow:hover{background:var(--hover)}.crow.active{background:var(--active)}
.crow.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.crow .more{margin-left:auto;visibility:hidden}.crow:hover .more,.crow .more:focus-visible{visibility:visible}
.crow .trunc{flex:1}
.rename-in{height:28px;width:100%;border:1px solid var(--accent);border-radius:4px;background:var(--surface);padding:0 6px;outline:0}
.sb-bot{display:flex;align-items:center;gap:6px;padding:8px;border-top:1px solid var(--border)}
.prof{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:4px;border-radius:4px;text-align:left}
.prof:hover{background:var(--hover)}
.pi{display:flex;flex-direction:column;line-height:1.2;min-width:0}.pi small{color:var(--muted)}
.collapsed .lbl,.collapsed .sb-list{display:none}
.collapsed .sb-bot{flex-direction:column}.collapsed .nav,.collapsed .btn.wide{justify-content:center;padding:0}
/* ===== CHAT ===== */
.chat-head{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid var(--border)}
.title-btn{font-weight:600;padding:4px 8px;border-radius:4px;max-width:40%}
button.title-btn:hover{background:var(--hover)}
.chat-head .chip{max-width:220px}
.msgs{flex:1;overflow:auto;padding:24px 16px}
.col{max-width:760px;margin:0 auto;width:100%}
.msg{margin-bottom:24px;position:relative}.dense .msg{margin-bottom:12px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.bubble{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;max-width:80%;white-space:pre-wrap;word-break:break-word;font-size:var(--fs)}
.dense .bubble{padding:6px 12px}
.bubble .chip{margin:0 4px 6px 0}
.acts{display:flex;gap:2px;margin-top:4px;opacity:0;transition:opacity .12s}
.msg:hover .acts,.acts:focus-within,.acts.show{opacity:1}
.msg.user .acts{opacity:0}.msg.user:hover .acts,.msg.user .acts:focus-within{opacity:1}
.acts .icon-btn{width:28px;height:28px;color:var(--muted)}.acts .icon-btn.on{color:var(--accent)}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-contrast);display:grid;place-items:center}
.avatar svg{width:12px;height:12px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:4px;animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:cb 1s steps(2) infinite}
@keyframes cb{50%{opacity:0}}
.edit{width:80%}.edit textarea{width:100%;border:1px solid var(--accent);border-radius:8px;padding:8px;background:var(--surface-2);font-size:var(--fs);resize:vertical;outline:0}
.ef{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.summary{border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:24px;background:var(--surface-2)}
.summary summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600}
.summary ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.art-card{display:flex;align-items:center;gap:10px;width:100%;max-width:420px;margin-top:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);text-align:left}
.art-card:hover{background:var(--hover)}.art-card div{flex:1;display:flex;flex-direction:column;min-width:0}
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;box-shadow:var(--shadow);z-index:5}
.welcome{flex:1;display:grid;place-items:center;overflow:auto;padding:16px}
.wcol{width:min(720px,100%);text-align:center}
.wcol h1{font-size:28px;font-weight:600;margin:10px 0 4px}.wcol p{margin:0 0 20px}
.glogo{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-contrast);display:inline-grid;place-items:center}
.glogo svg{width:24px;height:24px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.foot{flex:none;padding:0 16px 8px}
.ctx{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-bottom:6px;padding:0 4px}
.ctx .track{max-width:240px}.ctx.warn .fill{background:var(--warn)}.ctx.danger .fill{background:var(--danger)}
.ctx.warn span{color:var(--warn)}.ctx.danger span{color:var(--danger)}
/* ===== COMPOSER ===== */
.composer{position:relative;text-align:left;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);padding:8px 10px}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.composer textarea{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;font-size:var(--fs);line-height:1.5;padding:4px 2px;max-height:200px}
.attach-row{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:6px}
.ctools{display:flex;align-items:center;gap:4px;margin-top:4px}
.ctools .chip{height:28px;max-width:260px;border:1px solid var(--border);background:var(--surface)}
.send{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-contrast);display:grid;place-items:center;flex:none}
.send:disabled{background:var(--active);color:var(--muted);opacity:1}
.disc{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
.slash{position:absolute;left:8px;bottom:100%;margin-bottom:6px;min-width:260px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;z-index:10}
/* ===== MARKDOWN ===== */
.md{font-size:var(--fs);line-height:1.6;word-break:break-word}
.md p{margin:0 0 .8em}.md h1,.md h2,.md h3{margin:1em 0 .4em;line-height:1.25}
.md h1{font-size:1.4em}.md h2{font-size:1.2em}.md h3{font-size:1.05em}
.md ul,.md ol{margin:0 0 .8em;padding-left:1.5em}
.md blockquote{margin:0 0 .8em;padding:2px 12px;border-left:3px solid var(--accent);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:1em 0}
.md a{color:var(--accent)}
.md code{font-family:"Cascadia Code",Consolas,monospace;font-size:.9em;background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.md pre{margin:0 0 1em;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);overflow:hidden}
.md pre code{display:block;border:0;background:none;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.5}
.ph{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 4px 12px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);background:var(--hover)}
.md table{border-collapse:collapse;margin:0 0 1em;font-size:.95em}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left}.md th{background:var(--surface-2)}
/* ===== PANEL ===== */
.ph2{display:flex;align-items:center;gap:8px;padding:0 8px 0 14px;height:48px;border-bottom:1px solid var(--border);flex:none}
.badge{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--hover);color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{padding:4px 10px;border-radius:4px;color:var(--muted)}.tab.on{background:var(--active);color:var(--text)}
.pbody{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column}
.pbody iframe{flex:1;border:0;width:100%;background:#fff}
.pbody .doc{padding:20px 24px}
.src{margin:0;padding:14px;font:13px/1.5 "Cascadia Code",Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.pfoot{padding:8px 14px;font-size:12px;border-top:1px solid var(--border);flex:none}
/* ===== OVERLAYS ===== */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:100}
.backdrop.palback{place-items:start center;padding-top:12vh}
.backdrop.ob{inset:32px 0 0 0;background:var(--surface)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);animation:pop .15s ease-out;max-width:94vw;max-height:90vh;overflow:auto}
.modal.settings{width:min(960px,92vw);height:min(640px,86vh);overflow:hidden}
.modal.sm{width:min(480px,92vw)}.modal.pal{width:560px;overflow:hidden}
.modal.ob{width:min(720px,94vw);border:0;box-shadow:none;background:transparent;overflow:visible}
@keyframes pop{from{opacity:0;transform:scale(.98)}}
.dlg{padding:20px;display:flex;flex-direction:column;gap:10px}.dlg h3{margin:0}.dlg p{margin:0;color:var(--muted)}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.dlg-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:6px}
.pw{display:flex;gap:4px}.addm{display:flex;gap:6px}.addm .inp{flex:1}
#pd-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:24px}
.pop{position:fixed;z-index:200;min-width:180px;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:4px;animation:pop .12s ease-out}
.pop hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:4px;text-align:left}
.mi:hover,.mi.sel{background:var(--active)}.mi.danger{color:var(--danger)}
.mp{width:300px}.mp .inp{margin:2px 0 6px;width:100%}
#mplist{max-height:280px;overflow:auto}
.mgh{font-size:11px;text-transform:uppercase;color:var(--muted);padding:6px 8px 2px}
.mrow{display:flex;align-items:center;gap:6px;width:100%;min-height:32px;padding:4px 8px;border-radius:4px;text-align:left;flex-wrap:wrap}
.mrow:hover{background:var(--hover)}.mrow .nm{flex:1}
.tag{font-size:11px;padding:0 5px;border-radius:3px;background:var(--hover);color:var(--muted)}
.empty{text-align:center;padding:24px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:40px;height:40px}.empty h3{margin:0;color:var(--text)}
.toast-wrap,#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:300}
.toast{display:flex;align-items:center;gap:12px;background:var(--text);color:var(--surface);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);animation:pop .15s}
.toast .btn{height:24px;color:inherit;border-color:currentColor;background:transparent}
/* palette */
.pin{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-bottom:1px solid var(--border)}
.pin input{flex:1;border:0;outline:0;background:none;font-size:15px}
#pall{max-height:50vh;overflow:auto;padding:6px}
.pal-i{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:4px;text-align:left}
.pal-i.sel{background:var(--active)}
.pfoot2{padding:8px 14px;font-size:12px;border-top:1px solid var(--border)}
/* settings */
.set{display:flex;height:100%}
.set-nav{width:220px;flex:none;border-right:1px solid var(--border);background:var(--surface-2);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.snav{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:4px;text-align:left}
.snav:hover{background:var(--hover)}.snav.on{background:var(--active);font-weight:600}
.set-main{flex:1;overflow:auto;padding:24px;position:relative}
.set-main h2{margin:0 0 16px;font-size:20px}
.set-x{position:absolute;top:12px;right:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 8px;border-bottom:1px solid var(--border);border-radius:4px}
.row.hl{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.rt{min-width:0}.rl{font-weight:500}.rd{color:var(--muted);font-size:12px}
.rc{flex:none;width:260px;display:flex;justify-content:flex-end;gap:6px;align-items:center}.rc .tog{margin-left:auto}
.rc.free{width:auto}
.rowh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.rowh h1{margin:0;font-size:22px}
.prov{display:flex;align-items:center;gap:10px;margin-bottom:8px}.pm{flex:1;min-width:0}
.note{display:flex;gap:6px;align-items:center;font-size:12px;margin-top:12px}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.tile{width:110px;border:2px solid var(--border);border-radius:8px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface)}
.tile.on{border-color:var(--accent)}.tile:hover{background:var(--hover)}
.prev{display:block;width:100%;height:40px;border-radius:4px;border:1px solid var(--border)}
.prev.light{background:#fff}.prev.dark{background:#2b2b2b}.prev.system{background:linear-gradient(90deg,#fff 50%,#2b2b2b 50%)}
.sw{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff}
.sw svg{width:14px;height:14px}
.seg{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.seg button{padding:5px 12px}.seg button.on{background:var(--accent);color:var(--accent-contrast)}
.tbl{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}.tbl th{color:var(--muted);font-weight:500}
.memtools{display:flex;gap:8px;margin:10px 0}

<textarea id="composer" rows="1" data-input="composer" aria-label="Message" placeholder="Message ${APP_NAME}… (Markdown supported, / for commands)"></textarea>
<div class="ctools"><button class="icon-btn" data-action="att.pick" aria-label="Attach files" title="Attach">${icon('paperclip')}</button><input type="file" id="fileIn" multiple hidden data-change="attach"><button class="chip model-chip" data-action="model.picker" aria-label="Choose model"><span class="trunc">${modelLabel(curModelKey())}</span>${icon('chevron-down')}</button><button class="icon-btn${S.web?' on':''}" data-action="tog.web" aria-label="Web search" aria-pressed="${S.web}" title="Web search">${icon('globe')}</button><button class="icon-btn${S.think?' on':''}" data-action="tog.think" aria-label="Thinking" aria-pressed="${S.think}" title="Thinking">${icon('brain')}</button><span class="grow"></span><span class="muted sm" id="tokhint">0 tokens</span>${S.streaming?`<button class="send" data-action="stop" aria-label="Stop" title="Stop (Esc)">${icon('square')}</button>`:`<button class="send" id="sendBtn" data-action="send" aria-label="Send" disabled>${icon('arrow-up')}</button>`}</div></div><div class="disc">${APP_NAME} can make mistakes. Check important info.</div>`}
function autosize(t){t.style.height='auto';const lh=parseFloat(getComputedStyle(t).lineHeight)||22;t.style.height=Math.min(t.scrollHeight,lh*8)+'px'}
function syncComposer(t){const b=$('#sendBtn');if(b)b.disabled=!t.value.trim()&&!S.attachments.length;const h=$('#tokhint');if(h)h.textContent=Math.ceil(t.value.length/4)+' tokens'}

function runCmd(n){const t=$('#composer');if(t){t.value='';S.draft='';syncComposer(t);autosize(t)}S.slash=null;const b=$('#slash');b&&(b.hidden=true);({new:newChat,compact:()=>compact(),model:()=>{const m=$('.model-chip');m&&A['model.picker'](m)},clear:()=>{const c=curChat();if(c){c.messages=[];c.ctxExtra=0;render()}},memory:()=>openSettings('memory'),settings:()=>openSettings('general')})[n]()}
function wrap(t,a,b){b=b==null?a:b;const s=t.selectionStart,e=t.selectionEnd,v=t.value;t.value=v.slice(0,s)+a+v.slice(s,e)+b+v.slice(e);t.selectionStart=s+a.length;t.selectionEnd=e+a.length;t.dispatchEvent(new Event('input',{bubbles:true}))}
function composerKey(e){const t=e.target;
  if(S.slash){const s=S.slash;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();s.idx=(s.idx+(e.key==='ArrowDown'?1:-1)+s.items.length)%s.items.length;drawSlash();return true}

/* ===== ENGINE ===== */
function createChat(){const c={id:uid('c'),title:'New chat',pinned:false,projectId:S.newProjectId,updated:S.now+(++S.tick),model:curModelKey(),ctxExtra:0,messages:[]};S.chats.push(c);S.activeChatId=c.id;S.newProjectId=null;return c}
function newChat(){S.view='chat';S.activeChatId=null;S.newProjectId=null;S.draft='';S.editing=null;S.stick=true;render();focusComposer()}
function openChat(id){S.view='chat';S.activeChatId=id;S.stick=true;S.editing=null;render()}
function pickReply(text,regen){const R=S.replies;if(!regen){if(/\/code|\bcode\b/i.test(text))return R[2];if(/\bartifact\b|\bbuild\b/i.test(text))return /\b(doc|plan)\b/i.test(text)?R[4]:R[3]}return R[S.replyIdx++%R.length]}
function send(text){text=(text||'').trim();if(S.streaming||(!text&&!S.attachments.length))return;
  if(text==='/compact'){runCmd('compact');return}
  const c=curChat()||createChat();
  c.messages.push({id:mid(),role:'user',text,files:S.attachments.map(f=>f.name)});
  S.attachments=[];S.draft='';S.stick=true;c.updated=S.now+(++S.tick);
  if(c.title==='New chat')c.title=text.split(/\s+/).slice(0,5).join(' ')||'New chat';
  reply(c,text)}
function reply(c,text,regen){S.streaming=true;S.streamChat=c;const m={id:mid(),role:'assistant',text:'',typing:true,model:c.model};S.streamMsg=m;c.messages.push(m);render();
  typeT=setTimeout(()=>{m.typing=false;m.streaming=true;const r=pickReply(text,regen),tk=r.text.split(' ');let i=0;render();
    streamT=setInterval(()=>{if(i<tk.length){m.text+=(i?' ':'')+tk[i++];patchStream(m)}else{clearInterval(streamT);finish(c,m,r)}},25)},700)}
function patchStream(m){const el=$(`[data-mid="${m.id}"] .md`);if(!el)return;el.innerHTML=md(m.text)+'<span class="caret"></span>';const ms=$('#msgs');if(ms&&S.stick)ms.scrollTop=ms.scrollHeight;updateCtx()}
function updateCtx(){const c=S.streamChat||curChat(),el=$('#ctxbar');if(el&&c)el.outerHTML=ctxHtml(c)}
function finish(c,m,r){m.streaming=false;S.streaming=false;S.streamMsg=null;S.streamChat=null;c.ctxExtra+=20000;c.updated=S.now+(++S.tick);
  if(r.artifact){const id=uid('a');S.artifacts[id]=r.artifact;m.artifact=id;openArtifact(id)}
  S.replyCount++;render();
  if(S.prefs.autoCompact&&ctxInfo(c).pct>85){toast('Auto-compacting conversation…');compact()}
  if(S.prefs.memoryOn&&S.replyCount%3===0)memoryPrompt(c)}
function stop(){if(!S.streaming)return;clearTimeout(typeT);clearInterval(streamT);const m=S.streamMsg,c=S.streamChat;if(m&&c){m.typing=false;m.streaming=false;if(!m.text){const i=c.messages.indexOf(m);if(i>=0)c.messages.splice(i,1)}}S.streaming=false;S.streamMsg=null;S.streamChat=null;render()}
function compact(){const c=curChat();if(!c||S.streaming||S.compacting)return;if(c.messages.length<3&&!c.ctxExtra){toast('Nothing to compact yet');return}
  S.compacting=true;updateCtx();icons();
  setTimeout(()=>{const keep=c.messages.filter(m=>m.role!=='summary').slice(-2);c.messages=[{id:mid(),role:'summary'},...keep];c.ctxExtra=22000;S.compacting=false;render();toast('Conversation compacted')},1200)}
function memoryPrompt(c){const u=[...c.messages].reverse().find(m=>m.role==='user');if(!u)return;const text='Interested in: '+u.text.split(/\s+/).slice(0,6).join(' ');
  const add=()=>{const m={id:uid('m'),text,src:c.title,date:today()};S.memories.unshift(m);if(setM)renderSettings();return m};
  if(S.prefs.askSave)toast('Remember this?',{ms:6000,actions:[{label:'Save',run:add},{label:'Dismiss'}]});
  else{const m=add();toast('Memory updated',{actions:[{label:'Undo',run:()=>{S.memories=S.memories.filter(x=>x!==m);if(setM)renderSettings()}}]})}}

function openPalette(){if(palM)return;let q='',idx=0,list=[];
  const all=()=>[{sec:'Actions',label:'New chat',icon:'plus',run:newChat},{sec:'Actions',label:'Toggle theme',icon:'sun-moon',run:()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')},{sec:'Actions',label:'Open Settings',icon:'settings',run:()=>openSettings()},{sec:'Actions',label:'Toggle sidebar',icon:'panel-left',run:toggleSidebar},{sec:'Actions',label:'Compact conversation',icon:'layers',run:compact},{sec:'Actions',label:'Add provider',icon:'plug',run:()=>{openSettings('providers');provDialog()}},
    ...S.chats.map(c=>({sec:'Chats',label:c.title,icon:'message-square',run:()=>openChat(c.id)})),...S.projects.map(p=>({sec:'Projects',label:p.name,icon:'folder',run:()=>openProject(p.id)})),...PAGES.map(([k,l,i])=>({sec:'Settings',label:l,icon:i,run:()=>openSettings(k)}))];
  palM=modal(`<div class="pal"><div class="pin">${icon('search')}<input id="palq" placeholder="Search chats, projects, settings, actions…" aria-label="Command palette" autocomplete="off"></div><div id="pall"></div><div class="pfoot2 muted">↑↓ navigate · Enter select · Esc close</div></div>`,{cls:'palback',size:'pal',onClose:()=>{palM=null}});
  const draw=()=>{list=all().filter(x=>!q||x.label.toLowerCase().includes(q));idx=Math.min(idx,Math.max(0,list.length-1));let sec='';$('#pall').innerHTML=list.map((x,i)=>{const h=x.sec!==sec?`<div class="mgh">${x.sec}</div>`:'';sec=x.sec;return h+`<button class="pal-i${i===idx?' sel':''}" data-i="${i}">${icon(x.icon)}<span class="trunc">${esc(x.label)}</span></button>`}).join('')||'<div class="empty">No results</div>';icons();const s=$('#pall .sel');s&&s.scrollIntoView({block:'nearest'})};
  const go=i=>{const x=list[i];if(!x)return;palM.close();setTimeout(x.run,0)};
  const inp=$('#palq');inp.oninput=()=>{q=inp.value.toLowerCase();idx=0;draw()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();idx=Math.min(idx+1,list.length-1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();idx=Math.max(idx-1,0);draw()}else if(e.key==='Enter'){e.preventDefault();go(idx)}};
  $('#pall').onclick=e=>{const b=e.target.closest('[data-i]');b&&go(+b.dataset.i)};draw()}

function drawOb(){const o=OB;let b='';
  if(o.step===0)b=`<div class="logo big">${icon('cloud')}</div><h1>Welcome to ${APP_NAME}</h1><ul class="vals"><li>${icon('key-round')}Bring your own keys</li><li>${icon('shield-check')}Private by default</li><li>${icon('plug')}Works with any provider</li></ul>`;
  else if(o.step===1)b=`<h2>Connect a provider</h2><div class="tiles">${['openai','anthropic','openrouter','ollama','custom'].map(t=>`<button class="tile${o.type===t?' on':''}" data-action="ob.type" data-t="${t}"><span class="logo">${PT[t].ini}</span>${PT[t].short}</button>`).join('')}</div>`+(o.type?`<label>API key<input class="inp" id="ob-key" type="password" value="${esc(o.key)}" placeholder="${o.type==='ollama'?'Optional':'sk-…'}"></label>`+(['custom','ollama'].includes(o.type)?`<label>Base URL<input class="inp" id="ob-url" value="${esc(o.url||PT[o.type].url)}"></label>`:'')+`<button class="btn primary" data-action="ob.test"${o.busy?' disabled':''}>${o.busy?'Testing…':'Test &amp; continue'}</button>${o.ok?'<span class="ok">Connected</span>':''}`:'');
  else if(o.step===2){const p=S.providers[0];b=`<h2>Pick a default model</h2>`+(p?p.models.map(m=>`<button class="radio${o.model===m?' on':''}" data-action="ob.model" data-m="${esc(m)}">${icon(o.model===m?'circle-dot':'circle')}${esc(m)}</button>`).join(''):'<p class="muted">No provider connected. You can add one later in Settings.</p>')}
  else b=`<h2>Try it</h2><div class="pgrid4">${['Explain how closures work in JavaScript','Draft a friendly email to a new client','Debug a slow SQL query','Plan a two-week learning roadmap'].map((t,i)=>`<button class="card" data-action="ob.prompt" data-i="${i}">${t}</button>`).join('')}</div>`;
  $('#obc').innerHTML=`<div class="ob-c"><div class="ob-b">${b}</div><div class="ob-f"><button class="btn" data-action="ob.skip">Skip</button><span class="grow" style="display:flex;gap:6px;justify-content:center">${[0,1,2,3].map(i=>`<span class="dotp${i===o.step?' on':''}"></span>`).join('')}</span>${o.step?`<button class="btn" data-action="ob.back">Back</button>`:''}${o.step<3?`<button class="btn primary" data-action="ob.next">Next</button>`:''}</div></div>`;icons()}

 'pd.save':()=>{const name=$('#pd-name').value.trim();if(!name){toast('Name is required');return}const d={type:$('#pd-type').value,name,baseUrl:$('#pd-url').value.trim(),key:$('#pd-key').value,models:PD.models,status:PD.status};

 'mem.del':async el=>{if(await confirmDialog({title:'Delete memory?',body:'This memory will be forgotten.',danger:1,ok:'Delete'})){S.memories=S.memories.filter(m=>m.id!==el.dataset.id);renderSettings()}},
 'mem.clear':async()=>{if(await confirmDialog({title:'Clear all memories?',body:'This cannot be undone.',danger:1,ok:'Clear all'})){S.memories=[];renderSettings()}},

 'data.reset':async()=>{if(await confirmDialog({title:'Reset app?',body:'Local settings are cleared and onboarding is shown again.',danger:1,ok:'Reset'})){ls.clear();location.reload()}},

 'proj.create':()=>{const n=$('#np-name').value.trim();if(!n){toast('Name is required');return}const p={id:uid('pr'),name:n,desc:$('#np-desc').value.trim(),instructions:'',files:[],updated:today()};S.projects.unshift(p);stack[stack.length-1].close();openProject(p.id)},
 'proj.saveinst':()=>{const p=proj();p.instructions=$('#pinst').value;p.updated=today();toast('Instructions saved')},
 'proj.addf':()=>$('#pfile').click(),'proj.fdel':el=>{proj().files.splice(+el.dataset.i,1);render()},
 'proj.start':()=>{const t=$('#pcomposer').value.trim();if(!t)return;S.newProjectId=proj().id;S.view='chat';S.activeChatId=null;send(t)},
 /* onboarding */
 'ob.type':el=>{OB.type=el.dataset.t;OB.ok=false;drawOb()},
 'ob.test':()=>{const k=$('#ob-key');OB.key=k?k.value:'';const u=$('#ob-url');OB.url=u?u.value:PT[OB.type].url;
   if(!probe(OB.key,OB.type)){toast('Check your API key (placeholder)');return}
   OB.busy=true;drawOb();setTimeout(()=>{OB.busy=false;const t=OB.type;const p={id:uid('p'),type:t,name:PT[t].short,baseUrl:OB.url||PT[t].url,key:OB.key,enabled:true,status:'connected',models:FAKE[t].slice(0,4)};S.providers=[p];OB.ok=true;OB.model=p.models[0];if(obM)drawOb();setTimeout(()=>{if(OB.step===1&&obM){OB.step=2;drawOb()}},700)},900)},
 'ob.model':el=>{OB.model=el.dataset.m;drawOb()},
 'ob.next':()=>{OB.step=Math.min(3,OB.step+1);drawOb()},'ob.back':()=>{OB.step=Math.max(0,OB.step-1);drawOb()},

Object.assign(C,{
 attach:el=>{[...el.files].forEach(f=>S.attachments.push({name:f.name,size:fmtSize(f.size)}));render()},
 'pref.send':el=>{S.prefs.sendWith=el.value},

 'pd.type':el=>{const prev=PT[PD.type].label,n=$('#pd-name');if(!n.value.trim()||n.value===prev)n.value=PT[el.value].label;PD.type=el.value;$('#pd-url').value=PT[el.value].url;$('#pd-key').placeholder=el.value==='ollama'?'Optional':'sk-…'},
 'proj.files':el=>{const p=proj();[...el.files].forEach(f=>p.files.push({name:f.name,size:fmtSize(f.size)}));render()},
 'proj.rename':el=>{const p=proj(),v=el.value.trim();if(v)p.name=v;render()},
 import:()=>toast('Placeholder: import not wired yet')});
Object.assign(I,{
 composer:t=>{S.draft=t.value;autosize(t);syncComposer(t);slashUpdate(t)},
 'pref.name':el=>{S.prefs.name=el.value||'Abu';renderSidebar();icons();if(!curChat()&&S.view==='chat'){const h=$('.wcol h1');h&&(h.textContent=greeting())}},
 'pref.sys':el=>{S.prefs.sysPrompt=el.value},
 font:el=>{S.fontSize=+el.value;ls.set('fontSize',el.value);applyFont();$('#fval').textContent=el.value+'px'},
 setsearch:el=>{S.settings.search=el.value;const q=el.value.toLowerCase();if(q){const v=PAGES.filter(([k,l])=>l.toLowerCase().includes(q)||txt(PG[k]()).includes(q));if(v.length&&!v.some(p=>p[0]===S.settings.page))S.settings.page=v[0][0]}renderSettings()},
 memq:el=>{S.memq=el.value;$('#memlist').innerHTML=memList();icons()},
 projq:el=>{S.projq=el.value;$('#pgrid').innerHTML=projGrid()},
 mpsearch:el=>{$('#mplist').innerHTML=mpList(el.value);icons()},
 param:el=>{el.nextElementSibling.textContent=el.value}});

/* ===== EVENTS ===== */
document.addEventListener('click',e=>{const t=e.target;if(pop&&t.isConnected&&!t.closest('.pop'))closePop();const el=t.closest('[data-action]');if(!el)return;const f=A[el.dataset.action];f&&f(el,e)});
document.addEventListener('change',e=>{const n=e.target.dataset&&e.target.dataset.change;n&&C[n]&&C[n](e.target)});
document.addEventListener('input',e=>{const n=e.target.dataset&&e.target.dataset.input;n&&I[n]&&I[n](e.target)});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('rename-in')&&S.renaming)saveRename(e.target)});
document.addEventListener('scroll',e=>{const t=e.target;if(t.id!=='msgs')return;S.stick=t.scrollHeight-t.scrollTop-t.clientHeight<48;const j=$('#jump');j&&(j.hidden=S.stick)},true);
function saveRename(inp){const c=S.chats.find(x=>x.id===inp.dataset.id);const v=inp.value.trim();S.renaming=null;if(c&&v)c.title=v;render()}
document.addEventListener('keydown',e=>{
  const t=e.target,k=e.key.toLowerCase();
  if(t.id==='composer'&&composerKey(e))return;
  if(t.classList&&t.classList.contains('rename-in')){if(e.key==='Enter'){e.preventDefault();saveRename(t);return}}
  if(t.id==='pd-add'&&e.key==='Enter'){e.preventDefault();A['pd.addm']();return}
  if(e.key==='Enter'&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click();return}
  if(e.key==='Escape'){if(S.renaming){S.renaming=null;render();return}if(pop){closePop();return}if(stack.length){stack[stack.length-1].close();return}if(S.editing){S.editing=null;render();return}if(S.streaming)stop();return}
  if(e.key==='F11'){e.preventDefault();A['cap.max']();return}
  if(!e.ctrlKey||e.altKey)return;
  if(k==='k'&&!e.shiftKey){e.preventDefault();openPalette()}
  else if(k==='n'&&!e.shiftKey){e.preventDefault();newChat()}
  else if(k===','){e.preventDefault();openSettings()}
  else if(k==='b'&&!e.shiftKey&&t.id!=='composer'){e.preventDefault();toggleSidebar()}
  else if(k==='a'&&e.shiftKey){e.preventDefault();togglePanel()}
  else if(k==='c'&&e.shiftKey){e.preventDefault();compact()}
});

/* ===== INIT ===== */
applyTheme();applyAccent();applyFont();applyDensity();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='system')applyTheme()})}catch(e){}
render();
if(!S.onboarded)startOnboarding();
</script>
