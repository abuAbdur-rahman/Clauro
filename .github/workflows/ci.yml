name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch. A stale green is not information.
# Keyed on head_ref so a push to `dev` and the PR-sync run for a PR from `dev`
# share one group: without this, opening a PR doubles every workflow (push run
# + PR run that never cancel each other, because `github.ref` differs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action below is pinned to a full commit SHA, with the tag it resolves
# to kept as a comment for readability (CWE-829, PR #2 finding). A floating
# major tag is an edit someone else can make after review; a commit SHA is
# not. Refresh the pins deliberately, never as a side effect of another change.

jobs:
  # 1. The spec suite's own invariants.
  #
  # This is the gate that matters most right now. DECISIONS.md is the
  # authority and every other document restates it. When they drift, an agent
  # following Tasks/ builds the design we abandoned. Runs in seconds.
  docs:
    name: spec consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check D-refs, task count, crate names, DDL count
        run: python3 scripts/check-docs.py

  # 2. Platform matrix — Windows only until 021 re-enables Linux (D114).
  #
  # Linux primary + Linux floor are parked, not deleted: their exact definitions
  # live in `.github/workflows/linux-matrix.yml.disabled` (a non-`.yml` name, so
  # GitHub never executes it). They never completed — 35-minute walls against a
  # 30-minute job limit on cold builds with no cargo cache — and re-running red
  # teaches nothing. Windows primary + Windows floor are the gate until then.
  check:
    name: ${{ matrix.job }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: windows primary
            os: windows-latest
          - job: windows floor
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The detection guards come FIRST (PR #2 finding): every setup action
      # below reads a repo file — pnpm reads package.json's "packageManager",
      # the extractor reads rust-toolchain.toml — so running setup before the
      # guard that decides it applies makes a spec-only branch or a fork fail
      # for the wrong reason. On main/dev both manifests are present since
      # Tasks/002, so both gates always run.
      - name: Detect Rust workspace
        id: rust
        shell: bash
        run: 'echo "present=$(test -f Cargo.toml && echo true || echo false)" >> "$GITHUB_OUTPUT"'

      - name: Detect frontend manifest
        id: web
        shell: bash
        run: 'echo "present=$(test -f package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"'

      # Single source of truth for the Rust pin is rust-toolchain.toml.
      # The action does not read that file, so extract the channel here —
      # a second hardcoded version would drift silently. Block scalar: a
      # one-line run with nested quotes is unparseable in YAML.
      - name: Read pinned Rust toolchain
        id: tc
        if: steps.rust.outputs.present == 'true'
        shell: bash
        run: |
          echo "channel=$(grep -oP 'channel = "\K[^"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        if: steps.rust.outputs.present == 'true'
        with:
          toolchain: ${{ steps.tc.outputs.channel }}
          components: clippy, rustfmt
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.web.outputs.present == 'true'
        with:
          # No version input: the action reads package.json "packageManager".
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.web.outputs.present == 'true'
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      # (Linux webview deps step removed with the Linux jobs — D114. It lives
      # in `.github/workflows/linux-matrix.yml.disabled` and returns with them.)

      # The Windows floor pins a FIXED WebView2 runtime rather than relying on
      # whatever the image happens to ship. Full fixed-version install lands
      # with Tasks/021 (Phase 6); until then this step records the resolved
      # runtime version in the job log, so the next reader can tell what was
      # actually tested (TECH_STACK.md §5). A floor that records nothing is a
      # label, not a floor (D50).
      - name: Record the Windows floor WebView2 runtime version
        if: matrix.job == 'windows floor'
        shell: pwsh
        run: |
          $pv = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\ClientState\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          if (-not $pv) { Write-Host "::warning::no WebView2 runtime version found in registry - see Tasks/021"; exit 0 }
          Write-Host "WebView2 runtime version: $pv"

      - name: cargo fmt check
        if: steps.rust.outputs.present == 'true'
        run: cargo fmt --all -- --check

      - name: clippy
        if: steps.rust.outputs.present == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        if: steps.rust.outputs.present == 'true'
        # --locked is not optional in CI (release.yml:61). Without it, Cargo
        # lock drift silently updates instead of failing the build.
        run: cargo test --workspace --locked

      - name: Frontend lint, typecheck and test
        if: steps.web.outputs.present == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Note skipped gates
        if: "steps.rust.outputs.present == 'false' && steps.web.outputs.present == 'false'"
        # bash explicitly: the default shell is PowerShell on Windows, where
        # "cat" is Get-Content and pipes an object rather than a string.
        shell: bash
        run: echo "::notice::manifest absent on this ref - Rust and frontend gates skipped"

  # 3. Supply chain: Trivy via Aqua, filesystem scan, nothing cloned.
  #
  # Used by action reference, not vendored: it fetches its own pinned binary
  # and never clones a repository into ours.
  #
  # NOTE: every scan is exit-code 0 (report, do not block) for now. The first
  # run failed the build with the log unavailable, which is the worst of both
  # worlds: a red gate nobody can diagnose. Once the report artifact has been
  # read and triaged, the dependency and licence scans go back to exit-code 1.
  # The licence scan especially -- AGENTS.md's MIT-port-only rule depends on
  # it -- but a rule that fires before anyone has read its output trains people
  # to ignore it.
  trivy:
    name: trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: OS and language dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # fs, not image. image-ref expects a container reference and fails
          # with "could not parse reference: ." on a directory.
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-results.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Secret scanning and config scanning are --scanners on the fs scan in
      # current Trivy; the standalone scan-type values were removed, so a
      # separate step fails with 'unknown command "secret"'. One fs scan with
      # all three scanners enabled covers them.
      - name: Dependencies, secrets and misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          output: trivy-results.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Licence report. The forbidden/allowed lists originally written here
      # were silently DROPPED: trivy-action@v0.36 has no such inputs (its own
      # input validation announced this as a warning on every run). The scan
      # itself always targeted licences; the *policy* on top of it never
      # existed. A policy nobody can reconstruct is not a policy, so the dead
      # lists are removed rather than left to look enforced.
      # Enforcing a forbidden-licence list needs a trivy.yaml through the
      # action's `trivy-config` input — Tasks/022 owns that, together with
      # flipping this from report-only to blocking (exit-code 1). The porting
      # rule (D59, D60) is what makes that a release blocker when it lands.
      - name: Licence scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: license
          format: table
          output: trivy-licences.txt
          exit-code: "0"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report
          path: |
            trivy-results.txt
            trivy-licences.txt
          if-no-files-found: ignore

  # 4. Secret scan, independent of Trivy.
  #
  # AGENTS.md requires that grep for a key-shaped assignment find nothing.
  # Enforce it here so it cannot regress, and so a pushed key is a red build
  # rather than a bad night.
  no-secrets:
    name: no secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail on anything key-shaped
        run: |
          set -euo pipefail
          if git grep -nIE '(api[_-]?key|secret|passwd|password)[[:space:]]*[=:][[:space:]]*[A-Za-z0-9_-]{16,}' \
               -- ':!*.lock' ':!.github/**' ':!scripts/**'; then
            echo "::error::possible secret committed - see the matches above"
            exit 1
          fi
          echo "no key-shaped assignments"