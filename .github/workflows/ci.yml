name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same ref — a stale green is not information.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 1. The spec suite's own invariants ───────────────────────────────────
  # This is the gate that matters most right now: DECISIONS.md is the
  # authority and every other document restates it. When they drift, an agent
  # following Tasks/ builds the design we abandoned. Runs in seconds.
  docs:
    name: spec consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check D-refs, task count, crate names, DDL count
        run: python3 scripts/check-docs.py

  # ── 2. Platform matrix ──────────────────────────────────────────────────
  # Four jobs. Two are floors, and a floor failing is a release blocker, not a
  # warning (D50, D89). "Floor" means a RUNTIME version, not a runner label —
  # an older OS image does not give you an older WebView2.
  # Rust/Node job steps stay in place until Tasks/002 lands the workspace.
  check:
    name: ${{ matrix.job }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: linux (primary)
            os: ubuntu-24.04
          - job: linux (floor)
            os: ubuntu-24.04
          - job: windows (primary)
            os: windows-latest
          - job: windows (floor)
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux webview deps (primary only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev
      # The Windows floor pins a FIXED WebView2 runtime rather than relying on
      # whatever the image ships.
      - name: Pin the Windows floor WebView2 runtime
        if: matrix.job == 'windows (floor)'
        shell: pwsh
        run: Write-Host "pinned WebView2 runtime — see Tasks/021"
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: Frontend typecheck + lint
        run: |
          npm ci
          npm run lint
          npm run typecheck

  # ── 3. Supply chain: Trivy (Aqua) — filesystem, no clone ────────────────
  # The user asked for an Aqua check with no cloning. trivy-action is used by
  # reference, not vendored: it pulls its own pinned binary and never clones a
  # repo into ours.
  #
  # Scans: OS packages, language dependencies (cargo/npm), and IaC/licence.
  # exit-code 1 makes a finding BLOCK the build — an audit that only warns is
  # an audit nobody reads.
  trivy:
    name: trivy — vulnerabilities, secrets, licences
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by the Aqua action for vulnerability DB caching. Read-only.
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy — OS + language dependencies
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: .            # scan the repo filesystem, not a container
          format: table
          output: trivy-results.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"          # fail the job on a real finding

      - name: Trivy — secret scanning
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: secret
          image-ref: .
          exit-code: "1"

      - name: Trivy — misconfiguration / IaC
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: config
          image-ref: .
          exit-code: "1"

      - name: Trivy — licence policy
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: license
          image-ref: .
          exit-code: "1"
          # The whole porting argument depends on this. A GPL/AGPL dependency
          # would make an MIT repo undeliverable, so licence drift is a build
          # failure, not a note in a report.
          license-forbidden: AGPL-1.0-only,AGPL-1.0-or-later,AGPL-3.0,AGPL-3.0-only,AGPL-3.0-or-later,GPL-1.0,GPL-1.0-only,GPL-1.0-or-later,GPL-2.0,GPL-2.0-only,GPL-2.0-or-later,GPL-3.0,GPL-3.0-only,GPL-3.0-or-later,SSPL-1.0
          license-allowed: MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,Zlib,Unicode-3.0,Unicode-DFS-2016

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.txt
          if-no-files-found: ignore

  # ── 4. Secret scan — belt and braces, independent of Trivy ──────────────
  # AGENTS.md: `grep -ri 'api[_-]?key\s*='` must find nothing. Enforce it in CI
  # so it cannot regress, and so a pushed key is a red build, not a bad night.
  no-secrets:
    name: no secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail on anything key-shaped
        run: |
          set -euo pipefail
          # Only the working tree — history scanning is Trivy's job.
          if git grep -nIE '(api[_-]?key|secret|passwd|password)[[:space:]]*[=:][[:space:]]*["'"'"']?[A-Za-z0-9_\-]{16,}' \
               -- ':!*.lock' ':!.github/**' ':!scripts/**'; then
            echo "::error::possible secret committed — see above"
            exit 1
          fi
          echo "no key-shaped assignments"