[package]
name = "clauro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clauro — local-first, BYOK desktop client for Claude."
authors = ["Clauro"]
rust-version = "1.96"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "clauro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Pinned exactly: IPC-injection behaviour is version-dependent (D92).
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# Pinned exactly (D92). A floating "2" makes the 001 verdict unverifiable.
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
